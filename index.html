<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Mariage</title>

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

/* ================= BODY ================= */
body{
    margin:0;
    background:#efe8de;
    font-family:'Cormorant Garamond', serif;
    display:flex;
    justify-content:center;
    padding:30px;
    background-image:url('./wedding-bouquet-with-pink-flowers-gold-rings.jpg');
    background-size:cover;
    background-position:center;
    overflow-x:hidden;
    overflow-y:auto;}

/* ================= INVITATION ================= */
.invitation{
    width:800px;
    max-width:95%;
    background:#f9f4ee;
    border:4px solid #c9a54c;
    border-radius:25px;
    padding:50px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,0.25);
    opacity:0;
    transform:scale(0.95);
    transition:1s ease;
}

.invitation.show{
    opacity:1;
    transform:scale(1);
}

/* TEXT */
.family{ font-size:26px; }
.family-name{ font-size:64px; color:#5b0013; font-weight:700; }
.subtitle{ font-size:28px; margin-top:15px; }

.bride{
    font-family:'Great Vibes';
    font-size:120px;
    color:#5b0013;
    margin:20px 0;
}

.date{ font-size:60px; color:#5b0013; font-weight:bold; }

.location-name{
    font-family:'Great Vibes';
    font-size:70px;
    color:#5b0013;
}

.message{ 
    margin-top:40px; 
    font-size:26px; 
}

.footer{
    margin-top:40px;
    font-family:'Great Vibes';
    font-size:40px;
}

/* ================= GIFT ================= */
.gift-overlay{
    position:fixed;
    inset:0;
    background:#efe8de;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    cursor:pointer;
}

.gift-box{
    font-size:90px;
    animation:bounce 1.5s infinite;
}

.gift-text{
    margin-top:20px;
    font-size:22px;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

.gift-overlay.hide{
    opacity:0;
    transition:0.8s ease;
    pointer-events:none;
}

/* ================= RIBBON ================= */
.ribbon{
    position:fixed;
    inset:0;
    z-index:9998;
    pointer-events:none;
    transition:opacity 0.8s ease;
}

.ribbon::before,
.ribbon::after{
    content:"";
    position:absolute;
    background:#c9a54c;
    animation:openRibbon 1s forwards;
}

.ribbon::before{
    top:50%;
    left:0;
    width:100%;
    height:3px;
    transform:scaleX(0);
}

.ribbon::after{
    left:50%;
    top:0;
    width:3px;
    height:100%;
    transform:scaleY(0);
}

@keyframes openRibbon{
    to{ transform:scale(1); }
}

/* ================= CONFETTI ================= */
.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-10px;
    z-index:9999;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* ================= PETALS ================= */
.petal{
    position:fixed;
    top:-10px;
    width:12px;
    height:12px;
    background:pink;
    border-radius:50% 0 50% 50%;
    opacity:0.8;
    z-index:999;
    animation:fallPetal linear forwards;
}

@keyframes fallPetal{
    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

/* ================= RING ================= */
.ring{
    position:fixed;
    top:20px;
    right:20px;
    font-size:50px;
    animation:rotateRing 3s linear infinite;
    z-index:10000;
}

@keyframes rotateRing{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* ================= RESPONSIVE ================= */
@media (max-width:768px){

body{ padding:15px; }

.invitation{ padding:25px; }

.family{ font-size:18px; }
.family-name{ font-size:34px; }
.subtitle{ font-size:18px; }

.bride{ font-size:60px; }

.date{ font-size:32px; }

.location-name{ font-size:42px; }

.message{ font-size:18px; }

.footer{ font-size:22px; }

}

</style>
</head>

<body>

<!-- 🎀 RIBBON -->
<div class="ribbon"></div>

<!-- 🎁 GIFT -->
<div class="gift-overlay" id="gift">
    <div class="gift-box">💍</div>
    <div class="gift-text">Clique pour ouvrir l’invitation</div>
</div>

<!-- 💌 INVITATION -->
<div class="invitation" id="invitation">

    <div class="family">La famille</div>
    <div class="family-name">BENHAMMADI</div>
    <div class="subtitle">vous invite au mariage de leur fille</div>

    <div class="bride">Hidayet</div>

    <h2>Le</h2>
    <div class="date">14.06.2026</div>

    <div class="location-name">Laboda</div>
    <div class="city">Tlemcen</div>

    <a class="maps-btn"
       href="https://maps.google.com/?q=Laboda+Tlemcen"
       target="_blank">
       📍 Voir l'itinéraire
    </a>

    <div class="message">
        Votre présence sera pour nous un honneur.
    </div>

    <div class="footer">
        Au plaisir de partager ce moment magique.
    </div>

    <!-- ⏰ AJOUT DEMANDÉ -->
    <div class="message" style="margin-top:25px; font-size:24px;">
        ⏰ La cérémonie commencera à partir de <strong>21h</strong>
    </div>

</div>

<!-- 🎶 MUSIC -->
<audio id="music" src="music.mp3" preload="auto"></audio>

<script>

const gift = document.getElementById("gift");
const invitation = document.getElementById("invitation");
const ribbon = document.querySelector(".ribbon");
const music = document.getElementById("music");

gift.addEventListener("click", () => {

    gift.classList.add("hide");
    invitation.classList.add("show");

    music.play().catch(()=>{});

/* 🎊 CONFETTI */
for(let i = 0; i < 80; i++){
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
}

/* 🌸 PETALS */
for(let i = 0; i < 50; i++){
    let p = document.createElement("div");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (4 + Math.random() * 5) + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 8000);
}

/* 🎀 RIBBON DISAPPEARS AFTER 3s */
setTimeout(() => {
    ribbon.style.opacity = "0";
}, 3000);

/* 🧹 REMOVE GIFT */
setTimeout(() => {
    gift.style.display = "none";
}, 800);

});

</script>

</body>
</html>
