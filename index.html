<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Mariage</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#efe8de;
    font-family:'Cormorant Garamond', serif;
    display:flex;
    justify-content:center;
    padding:30px;
    background-image: url(./wedding-bouquet-with-pink-flowers-gold-rings.jpg);
    background-position: center; /* Center the image */
    background-repeat: no-repeat; /* Do not repeat the image */
    background-size: cover; 
}

.invitation{
    width:800px;
    max-width:95%;
    background:#f9f4ee;
    border:4px solid #c9a54c;
    border-radius:25px;
    padding:50px;
    text-align:center;
    position:relative;
    box-shadow:0 0 25px rgba(0,0,0,0.15);
}

.family{
    font-size:26px;
    margin-bottom:5px;
}

.family-name{
    font-size:64px;
    color:#5b0013;
    font-weight:700;
    text-transform:uppercase;
}

.subtitle{
    font-size:28px;
    margin-top:15px;
}

.bride{
    font-family:'Great Vibes', cursive;
    color:#5b0013;
    font-size:120px;
    line-height:1;
    margin:20px 0;
}

.info-section{
    margin-top:30px;
}

.date{
    font-size:60px;
    color:#5b0013;
    font-weight:bold;
}

.location-title{
    margin-top:30px;
    font-size:28px;
}

.location-name{
    font-family:'Great Vibes', cursive;
    font-size:70px;
    color:#5b0013;
}

.city{
    font-size:36px;
}

.message{
    margin-top:40px;
    font-size:26px;
}

.maps-btn{
    display:inline-block;
    margin-top:25px;
    background:#5b0013;
    color:white;
    text-decoration:none;
    padding:15px 35px;
    border-radius:40px;
    font-size:22px;
    transition:0.3s;
}

.maps-btn:hover{
    background:#7d0020;
    transform:scale(1.05);
}

.footer{
    margin-top:40px;
    font-family:'Great Vibes', cursive;
    font-size:40px;
    color:#5b0013;
}

/* =========================
   RESPONSIVE MOBILE
========================= */
@media (max-width: 768px) {

    body{
        padding:15px;
    }

    .invitation{
        padding:25px 18px;
        border-radius:18px;
    }

    .family{
        font-size:18px;
    }

    .family-name{
        font-size:34px;
    }

    .subtitle{
        font-size:18px;
    }

    .bride{
        font-size:60px;
        margin:15px 0;
    }

    .date{
        font-size:32px;
    }

    .location-title{
        font-size:20px;
    }

    .location-name{
        font-size:42px;
    }

    .city{
        font-size:22px;
    }

    .message{
        font-size:18px;
        margin-top:25px;
    }

    .maps-btn{
        font-size:16px;
        padding:12px 22px;
    }

    .footer{
        font-size:22px;
        margin-top:25px;
    }
}
</style>
</head>
<body>

<div class="invitation">

    <div class="family">La famille</div>

    <div class="family-name">BENHAMMADI</div>

    <div class="subtitle">
        vous invite au mariage de leur fille
    </div>

    <div class="bride">
        Hidayet
    </div>

    <div class="info-section">

        <h2>Le</h2>

        <div class="date">
            14.06.2026
        </div>

        <div class="location-title">
            Salle des fêtes
        </div>

        <div class="location-name">
            Laboda
        </div>

        <div class="city">
            Tlemcen
        </div>

        <!-- Lien cliquable Google Maps -->
        <a
            href="https://maps.google.com/?q=Laboda+Tlemcen"
            target="_blank"
            class="maps-btn">
            📍 Voir l'itinéraire
        </a>

    </div>

    <div class="message">
        Votre présence sera pour nous un honneur et contribuera
        à rendre ce moment encore plus mémorable.
    </div>

    <div class="footer">
        Au plaisir de partager cette journée pleine de bonheur avec vous.
    </div>

</div>

</body>
</html>
